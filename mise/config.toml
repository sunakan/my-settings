# インストール可能なrubyバージョン一覧
# mise ls-remote ruby
#
# 不要なバージョン等を削除
# mise prune
#
# 利用できるプラグイン一覧
# mise plugins update
# mise plugins ls-remote
#

[env]
# geminiを起動すると、以下のような警告が出るため抑制する
# (node:89335) [DEP0040] DeprecationWarning: The `punycode` module is deprecated. Please use a userland alternative instead.
# (Use `node --trace-deprecation ...` to show where the warning was created)
# (node:89348) [DEP0040] DeprecationWarning: The `punycode` module is deprecated. Please use a userland alternative instead.
NODE_OPTIONS = "--disable-warning=DEP0040"

[tools]
# 言語
# mise ls-remote --all
# mise ls-remote go
go = ['1.26.3']
ruby = ['3.4.9', '4.0.5']
nodejs = ['26.3.1']
java = ['temurin-21.0.10+7.0.LTS', 'temurin-25.0.2+10.0.LTS']
opentofu = ['1.11.4']
terraform = "1.15.7"
python = ['3.14.3']
erlang = ['27.3.4.12']
elixir = ['1.19.5-otp-27']

#
# 言語以外
#
# バックエンドの有無: mise registry xxxx
# 最新状態を確認: mise outdated
# 最新のやつ入れ直し: mise up
# awscli: 別のCPU typeがインストールされるので、brewで管理
# awscli = ['2.21.2', '2.21.3']
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:suzuki-shunsuke/ghtkn" = 'latest'
"aqua:suzuki-shunsuke/pinact" = 'latest'
"aqua:tmux" = '3.6b'
"aqua:jqlang/jq" = 'latest'
"aqua:tkuchiki/alp" = 'latest'
"aqua:BurntSushi/ripgrep" = 'latest'
"aqua:dandavison/delta" = 'latest'
"aqua:jesseduffield/lazygit" = 'latest'
"aqua:lsd-rs/lsd" = 'latest'
"aqua:mikefarah/yq" = 'latest'
"aqua:cli/cli" = 'latest'
"aqua:direnv/direnv" = 'latest'
"aqua:typst/typst" = 'latest'
"aqua:fullstorydev/grpcurl" = 'latest'
"aqua:protocolbuffers/protobuf/protoc" = 'latest'
"aqua:eksctl-io/eksctl" = 'latest'
"aqua:kubernetes/kubernetes/kubectl" = 'latest'
"aqua:cloudflare/cloudflared" = 'latest'
"aqua:golangci/golangci-lint" = 'latest'
"aqua:go-task/task" = 'latest'
"aqua:sqldef/sqldef/mysqldef" = 'latest'
"aqua:neovim/neovim" = 'latest'
# btmコマンドでtopみたいなやつ
"aqua:ClementTsang/bottom" = 'latest'
"aqua:junegunn/fzf" = 'latest'
# minisignはファイル検証に利用
"aqua:jedisct1/minisign" = 'latest'
# OrbStack同梱のdocker-credential-osxkeychainに"already exists in the keychain"の既知バグがある
# docker loginを繰り返すと再現するため、ECR専用のこのヘルパーで代替して回避
# https://github.com/orbstack/orbstack/issues/2457
#
# 導入後は ~/.docker/config.json に credHelpers を追加する(mise installだけでは反映されない)
# {
#   "credHelpers": {
#     "<account_id>.dkr.ecr.<region>.amazonaws.com": "ecr-login"
#   }
# }
"aqua:awslabs/amazon-ecr-credential-helper" = 'latest'

"asdf:mise-plugins/mise-eza" = 'latest'
"github:ByteNess/aws-vault" = 'latest'
"github:ocaml/opam" = 'latest'
"github:sunakan/op-vault" = "0.4.0"

"go:golang.org/x/tools/gopls" = 'latest'

"npm:@google/gemini-cli" = 'latest'
"npm:@openai/codex" = 'latest'

# profilecli: PyroscopeにpprofプロファイルのやりとりをするためのCLIツール
[tools."http:profilecli"]
version = "2.0.1"
platforms.macos-arm64.url = "https://github.com/grafana/pyroscope/releases/download/v{{version}}/profilecli_{{version}}_darwin_arm64.tar.gz"
platforms.macos-arm64.checksum = "sha256:2cee2f7a6b695ac6545ed4b284505290485778c43cf720ad468e42e10e2ce2c9"

# cage: ClaudeCodeをぶん回すために必要
#"go:github.com/Warashi/cage" = 'latest'
[tools."http:cage"]
version = "0.1.13"
platforms.macos-arm64.url = "https://github.com/Warashi/cage/releases/download/v{{version}}/cage_Darwin_arm64.tar.gz"
platforms.macos-arm64.checksum = "sha256:29ccee40b34bb4013700e03b21882914f2625e81749dcd0dc3deec408cbac477"

[tasks.lock-global]
run = "mise lock -g -p macos-arm64"
description = "Mac ARM 専用でグローバル lockfile を更新"

[settings]
# idiomatic version fileを有効化するかどうか
# asdfやmiseなどのバージョン管理ツールに依存しない「言語毎に標準的なバージョンファイル」
# 例: .go-version
idiomatic_version_file_enable_tools = ["go"]
lockfile = true
#locked = true
